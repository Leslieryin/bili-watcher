<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>B站随机观影总结器</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        width: 400px;
        margin: 0;
        padding: 14px;
        font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: #18191c;
        color: #e8e8ea;
      }
      h1 { font-size: 15px; margin: 0 0 4px; color: #00a1d6; }
      .sub { color: #888; font-size: 11px; margin-bottom: 12px; }
      .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
      button {
        flex: 1;
        padding: 8px 10px;
        border: 1px solid rgba(255,255,255,.14);
        border-radius: 8px;
        background: #232428;
        color: #e8e8ea;
        cursor: pointer;
        font-size: 13px;
      }
      button:hover { background: #2c2e33; }
      button.primary { background: #00a1d6; border-color: #00a1d6; color: #fff; font-weight: 600; }
      button.primary:hover { background: #0b8fc0; }
      button.danger { color: #ff7b7b; }
      label { display: block; color: #aaa; font-size: 11px; margin: 10px 0 4px; }
      input {
        width: 100%;
        padding: 6px 8px;
        background: #232428;
        border: 1px solid rgba(255,255,255,.14);
        border-radius: 6px;
        color: #e8e8ea;
        font-size: 12px;
      }
      .status {
        margin: 10px 0;
        padding: 8px 10px;
        background: #202124;
        border-left: 3px solid #00a1d6;
        border-radius: 4px;
        font-size: 12px;
        color: #bbb;
        word-break: break-word;
      }
      .item {
        padding: 8px 0;
        border-bottom: 1px solid rgba(255,255,255,.07);
        cursor: pointer;
      }
      .item:last-child { border-bottom: none; }
      .item .t { color: #ddd; font-size: 12px; }
      .item .m { color: #777; font-size: 11px; margin-top: 2px; }
      #list { max-height: 200px; overflow: auto; margin-top: 6px; }
      details summary { cursor: pointer; color: #888; font-size: 11px; margin-top: 10px; }
    </style>
  </head>
  <body>
    <h1>B站随机观影总结器</h1>
    <div class="sub">只读公开数据 · 复用浏览器登录态 · 不存账号密码</div>

    <div class="row">
      <button id="start" class="primary">启动</button>
      <button id="stop">停止</button>
    </div>
    <div class="row">
      <button id="tick">立即总结一条</button>
      <button id="clear" class="danger">清空记录</button>
    </div>

    <label>间隔(分钟)</label>
    <input id="interval" type="number" min="1" max="720" value="10" />

    <details>
      <summary>高级设置(LLM 总结 / 其它)</summary>
      <label>LLM 接口地址(留空则用离线模板归纳)</label>
      <input id="llmBase" placeholder="https://api.openai.com/v1" />
      <label>LLM API Key</label>
      <input id="llmKey" type="password" placeholder="sk-..." />
      <label>模型名</label>
      <input id="llmModel" value="gpt-4o-mini" />
      <div class="row" style="margin-top:8px">
        <button id="saveCfg">保存设置</button>
      </div>
    </details>

    <div class="status" id="status">未启动</div>
    <div id="list"></div>

    <script src="popup.js"></script>
  </body>
</html>
